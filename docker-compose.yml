services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: potes
      POSTGRES_USER: potes
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potes"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://potes:${DB_PASSWORD}@db:5432/potes
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8000"
    restart: unless-stopped

volumes:
  postgres_data:
